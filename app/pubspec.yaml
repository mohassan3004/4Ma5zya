name: ma5zya
description: "4Ma5zya – قارئ PDF عربي بصوتك المستنسخ بالذكاء الاصطناعي"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  crypto: ^3.0.3
  uuid: ^4.4.2
  pdfrx: ^1.0.80
  record: ^5.1.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F5C5C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
